name: Automation Runner
run-name: Automation #${{ inputs.automation_id || github.event.client_payload.automation_id || 'dispatch' }}

on:
  repository_dispatch:
    types:
      - automation_run
  workflow_dispatch:
    inputs:
      automation_id:
        description: "Automation ID"
        required: false
        type: string
      payload_gzip_b64:
        description: "Base64 GZIP payload from local dispatcher"
        required: true
        type: string

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      VW_OLLAMA_BASE_URL: http://127.0.0.1:11434
      VW_OLLAMA_AUTO_FALLBACK: "1"
      GH_RUNNER_OLLAMA_MODEL: ${{ vars.GH_RUNNER_OLLAMA_MODEL }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: video_workflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, ftp, mbstring, json, pdo, pdo_mysql, zlib

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v3

      - name: Install and warm Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS "http://${OLLAMA_HOST}/api/tags" >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS "http://${OLLAMA_HOST}/api/tags" >/dev/null

          OLLAMA_MODEL="${GH_RUNNER_OLLAMA_MODEL:-qwen2.5:3b}"
          echo "Using Ollama model: ${OLLAMA_MODEL}"
          echo "GH_RUNNER_OLLAMA_MODEL=${OLLAMA_MODEL}" >> "$GITHUB_ENV"
          echo "VW_OLLAMA_MODEL=${OLLAMA_MODEL}" >> "$GITHUB_ENV"

          ollama pull "${OLLAMA_MODEL}"

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          host = os.environ.get("OLLAMA_HOST", "127.0.0.1:11434")
          model = os.environ.get("GH_RUNNER_OLLAMA_MODEL") or "qwen2.5:3b"
          payload = json.dumps({
              "model": model,
              "prompt": 'Return valid JSON only. {"top":"Smoke test tagline","bottom":"prankwish.com"}',
              "stream": False,
              "format": "json",
              "options": {"temperature": 0}
          }).encode("utf-8")

          request = urllib.request.Request(
              f"http://{host}/api/generate",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=180) as response:
              data = json.loads(response.read().decode("utf-8"))

          text = (data.get("response") or "").strip()
          if '"top"' not in text or '"bottom"' not in text:
              raise SystemExit(f"Ollama smoke test returned unexpected payload: {text}")

          print("Ollama smoke test OK:", text)
          PY

      - name: Restore yt-dlp YouTube cookies
        env:
          YTDLP_COOKIES_B64: ${{ secrets.YTDLP_COOKIES_B64 }}
          YTDLP_COOKIES_B64_1: ${{ secrets.YTDLP_COOKIES_B64_1 }}
          YTDLP_COOKIES_B64_2: ${{ secrets.YTDLP_COOKIES_B64_2 }}
          YTDLP_COOKIES_B64_3: ${{ secrets.YTDLP_COOKIES_B64_3 }}
          YTDLP_COOKIES_B64_4: ${{ secrets.YTDLP_COOKIES_B64_4 }}
          YTDLP_COOKIES_B64_5: ${{ secrets.YTDLP_COOKIES_B64_5 }}
          YTDLP_COOKIES_B64_6: ${{ secrets.YTDLP_COOKIES_B64_6 }}
          YTDLP_COOKIES_B64_7: ${{ secrets.YTDLP_COOKIES_B64_7 }}
          YTDLP_COOKIES_B64_8: ${{ secrets.YTDLP_COOKIES_B64_8 }}
          YTDLP_COOKIES_B64_9: ${{ secrets.YTDLP_COOKIES_B64_9 }}
          YTDLP_COOKIES_B64_10: ${{ secrets.YTDLP_COOKIES_B64_10 }}
        run: |
          python3 - <<'PY'
          import os, base64, pathlib

          combined = (os.getenv("YTDLP_COOKIES_B64", "") or "").strip()
          mode = "single"

          if not combined:
              parts = []
              for idx in range(1, 11):
                  value = (os.getenv(f"YTDLP_COOKIES_B64_{idx}", "") or "").strip()
                  if value:
                      parts.append(value)
              combined = "".join(parts).strip()
              mode = "chunked"

          if not combined:
              print("No yt-dlp cookies secret found; continuing without cookies.txt")
              raise SystemExit(0)

          decoded = base64.b64decode(combined)
          target = pathlib.Path.home() / ".cache" / "yt-dlp" / "youtube" / "cookies.txt"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(decoded)
          target.chmod(0o600)
          print(f"Restored yt-dlp cookies using {mode} secret(s): {target}")
          PY

      - name: Decode automation payload
        id: payload
        env:
          DISPATCH_PAYLOAD: ${{ github.event.client_payload.payload_gzip_b64 }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload_gzip_b64 }}
        run: |
          python3 - <<'PY'
          import os, json, base64, gzip, pathlib

          payload_b64 = os.getenv("DISPATCH_PAYLOAD", "").strip() or os.getenv("INPUT_PAYLOAD", "").strip()
          if not payload_b64:
              raise SystemExit("Missing payload_gzip_b64")

          raw = gzip.decompress(base64.b64decode(payload_b64))
          data = json.loads(raw.decode("utf-8"))
          pathlib.Path("payload.json").write_text(json.dumps(data, ensure_ascii=False), encoding="utf-8")

          automation = data.get("automation") or {}
          automation_id = str(automation.get("id") or "")
          if not automation_id:
              raise SystemExit("automation.id missing in payload")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"automation_id={automation_id}\n")

          print("Payload decoded for automation:", automation_id)
          PY

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time"
          exit 1

      - name: Create schema
        run: |
          awk '/-- Insert Demo Data/{exit} {print}' database.sql > /tmp/schema.sql
          mysql -h127.0.0.1 -uroot -proot video_workflow < /tmp/schema.sql
          mysql -h127.0.0.1 -uroot -proot video_workflow -e "ALTER TABLE automation_settings MODIFY COLUMN api_key_id INT NULL;"

      - name: Apply app migrations
        env:
          VW_DB_HOST: 127.0.0.1
          VW_DB_NAME: video_workflow
          VW_DB_USER: root
          VW_DB_PASS: root
        run: |
          php -r "require 'config.php'; echo 'Runner DB migrations applied', PHP_EOL;"

      - name: Seed DB from payload
        env:
          VW_DB_HOST: 127.0.0.1
          VW_DB_NAME: video_workflow
          VW_DB_USER: root
          VW_DB_PASS: root
        run: |
          php scripts/bootstrap-runner-db.php payload.json

      - name: Run automation job
        env:
          VW_DB_HOST: 127.0.0.1
          VW_DB_NAME: video_workflow
          VW_DB_USER: root
          VW_DB_PASS: root
          VW_BASE_DATA_DIR: /tmp/VideoWorkflow
          VW_FFMPEG_PATH: ffmpeg
          VW_FFPROBE_PATH: ffprobe
          VW_YTDLP_COOKIES_FILE: /home/runner/.cache/yt-dlp/youtube/cookies.txt
          RUNNER_CALLBACK_URL: ${{ vars.GH_RUNNER_CALLBACK_URL }}
          RUNNER_CALLBACK_SECRET: ${{ secrets.GH_RUNNER_CALLBACK_SECRET }}
        run: |
          php -v
          php scripts/github-runner-job.php "${{ steps.payload.outputs.automation_id }}"

      - name: Upload output videos artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-output-${{ steps.payload.outputs.automation_id }}-${{ github.run_id }}
          path: /tmp/VideoWorkflow/output/*
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Ollama log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-log-${{ github.run_id }}
          path: /tmp/ollama.log
          if-no-files-found: ignore
          retention-days: 3
